<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dock 播放</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
    .preview-video { display: block; width: 100%; height: 100%; border: 0; background: transparent; cursor: grab; touch-action: none; }
    .preview-video:focus-visible { outline: 1px solid #fff; outline-offset: -2px; }
    .preview-video:active { cursor: grabbing; }
    .preview-return {
      position: absolute;
      inset-block-end: 2px;
      inset-inline-start: 50%;
      transform: translateX(-50%);
      inline-size: max-content;
      max-inline-size: 100%;
      min-block-size: 24px;
      padding: 4px min(6px, 8vw);
      border: 0;
      border-radius: 6px;
      background: rgba(20, 23, 31, 0.94);
      color: #fff;
      font: 600 11px/1.2 -apple-system, "PingFang SC", sans-serif;
      word-break: break-all;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }
    body:hover .preview-return,
    .preview-video:focus-visible + .preview-return,
    .preview-return:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .preview-return:hover { background: #262c3a; }
    .preview-return:focus-visible { outline: 2px solid #ff8396; outline-offset: -2px; }
    @media (max-width: 27px), (max-height: 24px) {
      .preview-return {
        inset-block-end: 0;
        min-block-size: 0;
        padding: 2px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <button type="button" class="preview-video" aria-label="单击播放或暂停，双击展开或缩回，滚动缩放，拖动移动，右键返回小窗"></button>
  <button type="button" class="preview-return">返回小窗</button>
  <script src="/js/taskbar-controls.js"></script>
  <script src="/js/mac-preview.js"></script>
</body>
</html>
